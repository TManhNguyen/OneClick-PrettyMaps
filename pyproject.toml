[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oneclick-prettymaps"
version = "0.5.0"
description = "Colourful map posters on Google Colab, built on prettymaps"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
# prettymaps itself is installed separately with --no-deps (see README):
# its own requirement list upgrades ipykernel (breaks Colab) and pulls
# streamlit, marimo and vsketch/PySide6, none of which are needed here.
# These are the packages prettymaps' downloader actually imports.
dependencies = [
    "osmnx>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas",
    "rasterio",
    "rioxarray",
    "elevation",
    "scikit-image",
    "scikit-learn",
    "thefuzz",
    "tqdm",
]

[project.optional-dependencies]
picker = ["ipyleaflet>=0.19", "ipywidgets>=8"]
test = ["pytest"]

[tool.setuptools]
packages = ["oneclick_prettymaps"]
